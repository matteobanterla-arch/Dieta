<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Comanda — Diario alimentare</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Comanda">
<meta name="theme-color" content="#C1432E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FBF6EA'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23C1432E' stroke-width='4' stroke-dasharray='6 5'/%3E%3Ctext x='50' y='45' font-family='Georgia,serif' font-size='15' font-weight='700' fill='%23C1432E' text-anchor='middle'%3ELA%3C/text%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='15' font-weight='700' fill='%23C1432E' text-anchor='middle'%3ECOM.%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23C1432E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --kraft:#DCCBA0;
    --kraft-dark:#C8B78F;
    --paper:#FBF6EA;
    --paper-shadow: 0 3px 0 rgba(44,38,32,.06), 0 10px 18px -10px rgba(44,38,32,.35);
    --ink:#2C2620;
    --ink-soft:#665B4C;
    --tomato:#C1432E;
    --tomato-dark:#9C3323;
    --basil:#5B7553;
    --line: rgba(44,38,32,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,.25), transparent 60%),
      repeating-linear-gradient(135deg, rgba(0,0,0,.015) 0 2px, transparent 2px 6px),
      var(--kraft);
    color:var(--ink);
    font-family:'Special Elite', 'Courier New', monospace;
    min-height:100vh;
    padding-bottom:48px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  .wrap{max-width:480px; margin:0 auto; padding:18px 14px 0;}

  /* Header / stamp title */
  header{ text-align:center; padding:14px 0 10px; position:relative;}
  header .stamp-ring{
    display:inline-flex; align-items:center; justify-content:center;
    width:84px; height:84px; border-radius:50%;
    border:3px dashed var(--tomato);
    transform:rotate(-6deg);
    margin-bottom:6px;
  }
  header .stamp-ring span{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
    letter-spacing:.06em; color:var(--tomato); line-height:1.15; text-align:center;
  }
  h1{
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.03em;
    font-size:22px; margin:2px 0 2px; text-transform:uppercase;
  }
  header p.sub{ margin:0; font-size:12.5px; color:var(--ink-soft);}

  /* Day navigator */
  .day-nav{
    display:flex; align-items:center; gap:8px; margin:16px 0 8px;
    background:var(--paper); border-radius:10px; padding:8px 10px;
    box-shadow:var(--paper-shadow);
  }
  .day-nav button.arrow{
    background:none; border:none; font-size:18px; color:var(--tomato);
    width:32px; height:32px; border-radius:50%; cursor:pointer; font-family:inherit;
  }
  .day-nav button.arrow:active{background:rgba(193,67,46,.12);}
  .day-nav .date-box{flex:1; text-align:center;}
  .day-nav input[type=date]{
    font-family:'Special Elite',monospace; font-size:14px; border:none; background:none;
    color:var(--ink); text-align:center; width:100%;
  }
  .day-nav .today-btn{
    font-family:'Oswald',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; background:none; border:1px solid var(--tomato); color:var(--tomato);
    border-radius:20px; padding:5px 10px; cursor:pointer;
  }

  /* Day strip */
  .day-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-chip{
    flex:0 0 auto; font-family:'Oswald',sans-serif; font-size:11px; font-weight:600;
    background:var(--paper); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .day-chip.active{ background:var(--tomato); color:#fff; border-color:var(--tomato-dark);}
  .day-chip b{font-weight:700;}

  /* Form ticket */
  .ticket-form{
    background:var(--paper); border-radius:4px; padding:16px 16px 14px;
    box-shadow:var(--paper-shadow); position:relative; margin:10px 0 20px;
  }
  .ticket-form::before{
    content:""; position:absolute; left:14px; right:14px; top:0; height:0;
    border-top:2px dashed var(--kraft-dark);
  }
  .ticket-form .label{
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em;
    color:var(--ink-soft); text-transform:uppercase; margin:14px 0 6px;
  }
  .ticket-form .label:first-of-type{margin-top:4px;}
  .meal-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .meal-btn{
    display:flex; align-items:center; gap:8px; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.02em; padding:10px 6px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .meal-btn .dot{width:9px; height:9px; border-radius:50%; background:currentColor; opacity:.55;}
  .meal-btn.sel{ color:#fff; border-color:transparent;}
  .meal-btn.sel .dot{opacity:1; background:#fff;}
  .meal-btn[data-meal="colazione"].sel{background:#B8863B;}
  .meal-btn[data-meal="pranzo"].sel{background:var(--tomato);}
  .meal-btn[data-meal="cena"].sel{background:#5B5C8D;}
  .meal-btn[data-meal="spuntino"].sel{background:var(--basil);}

  textarea{
    width:100%; font-family:'Special Elite',monospace; font-size:14.5px; color:var(--ink);
    background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px;
    resize:vertical; min-height:64px; line-height:1.45;
  }
  textarea:focus, input:focus, .meal-btn:focus-visible, button:focus-visible{
    outline:2.5px solid var(--tomato); outline-offset:2px;
  }

  .photo-row{display:flex; gap:8px;}
  .photo-btn{
    flex:1; font-family:'Oswald',sans-serif; font-size:11.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em; background:#fff; color:var(--ink-soft);
    border:1.5px dashed var(--line); border-radius:8px; padding:10px 6px; cursor:pointer;
  }
  .photo-preview{ position:relative; margin-top:10px; display:none;}
  .photo-preview.show{display:block;}
  .photo-preview img{ width:100%; max-height:220px; object-fit:cover; border-radius:8px; display:block;}
  .photo-preview .rm{
    position:absolute; top:6px; right:6px; background:rgba(44,38,32,.75); color:#fff;
    border:none; border-radius:50%; width:26px; height:26px; font-size:14px; cursor:pointer;
  }

  .save-btn{
    width:100%; margin-top:16px; font-family:'Oswald',sans-serif; font-weight:700;
    font-size:14px; letter-spacing:.05em; text-transform:uppercase; color:#fff;
    background:var(--tomato); border:none; border-radius:8px; padding:13px; cursor:pointer;
    box-shadow:0 4px 0 var(--tomato-dark);
  }
  .save-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--tomato-dark);}

  /* Entries list */
  .day-total{
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.06em; margin:4px 2px 10px;
  }
  .pdf-row{display:flex; gap:8px; margin:0 2px 18px;}
  .pdf-btn{
    flex:1; font-family:'Oswald',sans-serif; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em; background:#fff; color:var(--basil);
    border:1.5px solid var(--basil); border-radius:8px; padding:9px 6px; cursor:pointer;
  }
  .pdf-btn:active{background:var(--basil); color:#fff;}
  .pdf-btn:disabled{opacity:.5; cursor:default;}
  .entry{
    background:var(--paper); border-radius:2px; padding:14px 15px 14px; margin-bottom:16px;
    position:relative; box-shadow:var(--paper-shadow);
    animation: dropin .35s ease-out;
  }
  @keyframes dropin{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .entry::before{
    content:""; position:absolute; left:0; right:0; top:-1px; height:8px;
    background-image: radial-gradient(circle, var(--kraft) 3px, transparent 3.2px);
    background-size: 14px 14px; background-position: 0 -7px; background-repeat: repeat-x;
  }
  .entry-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-family:'Oswald',sans-serif;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; padding:4px 10px; border-radius:20px; transform:rotate(-2deg);
  }
  .badge[data-meal="colazione"]{background:#B8863B;}
  .badge[data-meal="pranzo"]{background:var(--tomato);}
  .badge[data-meal="cena"]{background:#5B5C8D;}
  .badge[data-meal="spuntino"]{background:var(--basil);}
  .entry-time{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .del-btn{
    background:none; border:none; color:var(--ink-soft); opacity:.6; font-size:11px;
    font-family:'Oswald',sans-serif; letter-spacing:.03em; cursor:pointer; text-transform:uppercase;
  }
  .entry-desc{ margin:10px 0 0; font-size:14.5px; line-height:1.5; white-space:pre-wrap;}
  .entry-photo{ margin-top:10px; border-radius:6px; overflow:hidden; cursor:zoom-in;}
  .entry-photo img{width:100%; max-height:260px; object-fit:cover; display:block;}

  .empty{
    text-align:center; padding:34px 14px; color:var(--ink-soft);
  }
  .empty .stamp-ring{width:64px; height:64px; margin-bottom:10px; opacity:.55;}
  .empty p{font-size:13.5px; margin:4px 0 0; line-height:1.5;}

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,16,12,.92); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:6px;}
  .lightbox-close{
    position:absolute; top:18px; right:18px; background:none; border:none; color:#fff;
    font-size:28px; cursor:pointer; line-height:1;
  }

  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stamp-ring"><span>LA<br>COMANDA</span></div>
    <h1>La Comanda</h1>
    <p class="sub">Il diario di cosa mangi, un ordine alla volta.</p>
  </header>

  <div class="day-nav">
    <button class="arrow" id="prevDay" aria-label="Giorno precedente">‹</button>
    <div class="date-box"><input type="date" id="dateInput"></div>
    <button class="arrow" id="nextDay" aria-label="Giorno successivo">›</button>
    <button class="today-btn" id="todayBtn">Oggi</button>
  </div>

  <div class="day-strip" id="dayStrip"></div>

  <form class="ticket-form" id="entryForm">
    <div class="label">Pasto</div>
    <div class="meal-grid" id="mealGrid">
      <button type="button" class="meal-btn" data-meal="colazione"><span class="dot"></span>Colazione</button>
      <button type="button" class="meal-btn" data-meal="pranzo"><span class="dot"></span>Pranzo</button>
      <button type="button" class="meal-btn" data-meal="cena"><span class="dot"></span>Cena</button>
      <button type="button" class="meal-btn" data-meal="spuntino"><span class="dot"></span>Spuntino</button>
    </div>

    <div class="label">Cosa hai mangiato</div>
    <textarea id="descInput" placeholder="Es. Pasta al pomodoro, insalata verde, una mela..."></textarea>

    <div class="label">Foto (facoltativa)</div>
    <div class="photo-row">
      <button type="button" class="photo-btn" id="cameraBtn">📷 Scatta foto</button>
      <button type="button" class="photo-btn" id="galleryBtn">🖼 Dalla galleria</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*">
    <div class="photo-preview" id="photoPreview">
      <img id="photoImg" alt="Anteprima foto pasto">
      <button type="button" class="rm" id="removePhoto">✕</button>
    </div>

    <button type="submit" class="save-btn">Timbra la comanda</button>
  </form>

  <div class="day-total" id="dayTotal"></div>
  <div class="pdf-row">
    <button type="button" class="pdf-btn" id="pdfDayBtn">⬇ PDF giornata</button>
    <button type="button" class="pdf-btn" id="pdfWeekBtn">⬇ PDF settimana</button>
  </div>
  <div id="entriesList"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" alt="Foto pasto ingrandita">
</div>

<script>
(function(){
  const STORAGE_KEY = 'comanda_entries_v1';
  const MEAL_LABELS = {colazione:'Colazione', pranzo:'Pranzo', cena:'Cena', spuntino:'Spuntino'};

  let entries = [];
  try{ entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ entries = []; }

  let selectedMeal = null;
  let pendingPhoto = null; // dataURL
  let selectedDate = todayStr();

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function saveEntries(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(e){
      alert('Spazio di archiviazione pieno: prova a rimuovere qualche foto da comande vecchie, oppure usa descrizioni senza foto.');
    }
  }

  function fmtDateLong(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
  }
  function fmtDateShort(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'});
  }

  const dateInput = document.getElementById('dateInput');
  dateInput.value = selectedDate;

  document.getElementById('prevDay').onclick = ()=> shiftDay(-1);
  document.getElementById('nextDay').onclick = ()=> shiftDay(1);
  document.getElementById('todayBtn').onclick = ()=> { selectedDate = todayStr(); dateInput.value = selectedDate; render(); };
  dateInput.onchange = ()=> { selectedDate = dateInput.value || todayStr(); render(); };

  function shiftDay(delta){
    const d = new Date(selectedDate+'T00:00:00');
    d.setDate(d.getDate()+delta);
    selectedDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    dateInput.value = selectedDate;
    render();
  }

  // Meal buttons
  document.querySelectorAll('.meal-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedMeal = btn.dataset.meal;
      document.querySelectorAll('.meal-btn').forEach(b=> b.classList.toggle('sel', b===btn));
    });
  });

  // Photo capture
  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');
  document.getElementById('cameraBtn').onclick = ()=> cameraInput.click();
  document.getElementById('galleryBtn').onclick = ()=> galleryInput.click();
  cameraInput.onchange = e=> handlePhotoFile(e.target.files[0]);
  galleryInput.onchange = e=> handlePhotoFile(e.target.files[0]);

  function handlePhotoFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      compressImage(ev.target.result, (dataUrl, w, h)=>{
        pendingPhoto = {url:dataUrl, w:w, h:h};
        document.getElementById('photoImg').src = dataUrl;
        document.getElementById('photoPreview').classList.add('show');
      });
    };
    reader.readAsDataURL(file);
  }

  function compressImage(srcDataUrl, cb){
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72), w, h);
    };
    img.src = srcDataUrl;
  }

  document.getElementById('removePhoto').onclick = ()=>{
    pendingPhoto = null;
    document.getElementById('photoPreview').classList.remove('show');
    cameraInput.value = ''; galleryInput.value = '';
  };

  // Form submit
  document.getElementById('entryForm').addEventListener('submit', e=>{
    e.preventDefault();
    const desc = document.getElementById('descInput').value.trim();
    if(!selectedMeal){ alert('Scegli il tipo di pasto.'); return; }
    if(!desc){ alert('Descrivi cosa hai mangiato.'); return; }
    entries.push({
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      date: selectedDate,
      meal: selectedMeal,
      desc: desc,
      photo: pendingPhoto? pendingPhoto.url : null,
      photoW: pendingPhoto? pendingPhoto.w : null,
      photoH: pendingPhoto? pendingPhoto.h : null,
      ts: Date.now()
    });
    saveEntries();
    document.getElementById('descInput').value = '';
    document.getElementById('removePhoto').click();
    selectedMeal = null;
    document.querySelectorAll('.meal-btn').forEach(b=> b.classList.remove('sel'));
    render();
  });

  // Lightbox
  const lightbox = document.getElementById('lightbox');
  document.getElementById('lightboxClose').onclick = ()=> lightbox.classList.remove('show');
  lightbox.addEventListener('click', e=>{ if(e.target===lightbox) lightbox.classList.remove('show'); });

  function deleteEntry(id){
    if(!confirm('Annullare questa comanda?')) return;
    entries = entries.filter(en=> en.id!==id);
    saveEntries();
    render();
  }

  // ---- Export PDF ----
  function mealColor(meal){
    switch(meal){
      case 'colazione': return [184,134,59];
      case 'pranzo': return [193,67,46];
      case 'cena': return [91,92,141];
      case 'spuntino': return [91,117,83];
      default: return [44,38,32];
    }
  }

  function getWeekRange(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const day = d.getDay(); // 0=Dom..6=Sab
    const diffToMonday = (day===0? -6 : 1-day);
    const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const toStr = dt=> dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    return {start: toStr(monday), end: toStr(sunday)};
  }

  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  function exportPdf(dateFrom, dateTo, rangeLabel, filename){
    if(!window.jspdf){ alert('Libreria PDF non disponibile: controlla la connessione a internet e riprova.'); return; }
    const sel = entries
      .filter(en=> en.date>=dateFrom && en.date<=dateTo)
      .sort((a,b)=> a.date===b.date ? a.ts-b.ts : (a.date<b.date? -1:1));
    if(sel.length===0){ alert('Nessuna comanda da esportare in questo periodo.'); return; }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const marginX = 15, pageW = 210, pageH = 297, contentW = pageW - marginX*2;
    let y = 20;

    function checkBreak(needed){
      if(y+needed > pageH-18){ doc.addPage(); y=20; }
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(193,67,46);
    doc.text('La Comanda — Diario alimentare', marginX, y); y+=7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(90,80,70);
    doc.text(rangeLabel, marginX, y); y+=9;
    doc.setDrawColor(200,183,143); doc.setLineWidth(0.4);
    doc.line(marginX, y, pageW-marginX, y); y+=8;

    let curDate = null;
    sel.forEach(en=>{
      if(en.date !== curDate){
        curDate = en.date;
        checkBreak(13);
        const label = capitalize(new Date(curDate+'T00:00:00').toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'}));
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(44,38,32);
        doc.text(label, marginX, y); y+=6;
        doc.setDrawColor(220,203,160); doc.setLineWidth(0.3);
        doc.line(marginX, y, pageW-marginX, y); y+=6;
      }
      checkBreak(14);
      const time = new Date(en.ts).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
      const col = mealColor(en.meal);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(col[0],col[1],col[2]);
      doc.text((MEAL_LABELS[en.meal]||en.meal).toUpperCase(), marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,110,95);
      doc.text('ore '+time, pageW-marginX, y, {align:'right'});
      y+=5.5;

      doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(44,38,32);
      const lines = doc.splitTextToSize(en.desc, contentW);
      lines.forEach(line=>{
        checkBreak(5.5);
        doc.text(line, marginX, y); y+=5.2;
      });

      if(en.photo){
        const maxImgW = 90, maxImgH = 70;
        let iw = maxImgW, ih = maxImgH;
        if(en.photoW && en.photoH){
          const ratio = en.photoW/en.photoH;
          if(maxImgW/ratio <= maxImgH){ iw = maxImgW; ih = maxImgW/ratio; }
          else { ih = maxImgH; iw = maxImgH*ratio; }
        }
        checkBreak(ih+4);
        try{ doc.addImage(en.photo, 'JPEG', marginX, y, iw, ih); }catch(e){}
        y += ih+4;
      }
      y += 4;
    });

    doc.save(filename);
  }

  document.getElementById('pdfDayBtn').onclick = ()=>{
    const label = capitalize(fmtDateLong(selectedDate));
    exportPdf(selectedDate, selectedDate, label, 'comanda-'+selectedDate+'.pdf');
  };
  document.getElementById('pdfWeekBtn').onclick = ()=>{
    const {start, end} = getWeekRange(selectedDate);
    const label = 'Settimana dal '+fmtDateShort(start)+' al '+fmtDateShort(end);
    exportPdf(start, end, label, 'comanda-settimana-'+start+'_'+end+'.pdf');
  };

  function render(){
    // day strip: recent days with entries, plus selected date if not present
    const dayMap = {};
    entries.forEach(en=>{ dayMap[en.date] = (dayMap[en.date]||0)+1; });
    const days = Object.keys(dayMap).sort().reverse().slice(0,14);
    if(!days.includes(selectedDate)) days.unshift(selectedDate);
    days.sort().reverse();
    const strip = document.getElementById('dayStrip');
    strip.innerHTML = '';
    days.forEach(d=>{
      const chip = document.createElement('button');
      chip.type='button';
      chip.className = 'day-chip'+(d===selectedDate?' active':'');
      chip.innerHTML = fmtDateShort(d) + (dayMap[d]? ' <b>('+dayMap[d]+')</b>' : '');
      chip.onclick = ()=>{ selectedDate=d; dateInput.value=d; render(); };
      strip.appendChild(chip);
    });

    const dayEntries = entries.filter(en=> en.date===selectedDate).sort((a,b)=> a.ts-b.ts);
    document.getElementById('dayTotal').textContent =
      fmtDateLong(selectedDate) + ' — ' + dayEntries.length + (dayEntries.length===1?' comanda registrata':' comande registrate');

    const list = document.getElementById('entriesList');
    list.innerHTML = '';
    if(dayEntries.length===0){
      list.innerHTML = `<div class="empty">
        <div class="stamp-ring" style="display:inline-flex;align-items:center;justify-content:center;border:3px dashed var(--kraft-dark);border-radius:50%;"><span style="font-family:'Oswald',sans-serif;font-weight:700;font-size:10px;color:var(--ink-soft);">TAVOLO<br>VUOTO</span></div>
        <p>Nessuna comanda per questo giorno.<br>Compila il modulo sopra per registrare un pasto.</p>
      </div>`;
      return;
    }
    dayEntries.forEach(en=>{
      const time = new Date(en.ts).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML = `
        <div class="entry-top">
          <div>
            <span class="badge" data-meal="${en.meal}">${MEAL_LABELS[en.meal]||en.meal}</span>
            <div class="entry-time">ore ${time}</div>
          </div>
          <button type="button" class="del-btn">Annulla</button>
        </div>
        <p class="entry-desc"></p>
        ${en.photo? `<div class="entry-photo"><img src="${en.photo}" alt="Foto del pasto"></div>` : ''}
      `;
      el.querySelector('.entry-desc').textContent = en.desc;
      el.querySelector('.del-btn').onclick = ()=> deleteEntry(en.id);
      const photoEl = el.querySelector('.entry-photo');
      if(photoEl){
        photoEl.onclick = ()=>{
          document.getElementById('lightboxImg').src = en.photo;
          lightbox.classList.add('show');
        };
      }
      list.appendChild(el);
    });
  }

  render();
})();
</script>
</body>
</html>
